<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url("/bg-image.jpg") center/cover;
        }

        .welcome-card {
            padding: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out;
        }

        h2 { font-size: 32px; margin-bottom: 10px; }
        p { opacity: 0.8; margin-bottom: 20px; }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #2eff35;
            border: 1px solid #2eff35;
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #2eff35;
            color: black;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h2>Welcome back!</h2>
        <p>Login Successful.</p>
        <a href="index.html" class="back-btn">Logout</a>
    </div>
</body>
</html>
