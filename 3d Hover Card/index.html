<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Card Hover Effect</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="card-image-wrap">
                <img src="images/bg-image-1.jpg" alt="Mountain Peak" class="card-bg">
                <div class="glare"></div>
            </div>
            <div class="card-content">
                <span class="category">Adventure</span>
                <h2>The Explorer</h2>
                <p>Pushing the boundaries of height and endurance.</p>
                <button class="btn-explorer">Discover</button>
            </div>
        </div>

        <div class="card">
            <div class="card-image-wrap">
                <img src="images/bg-image-2.jpg" alt="Modern Architecture" class="card-bg">
                <div class="glare"></div>
            </div>
            <div class="card-content">
                <span class="category">Design</span>
                <h2>The Minimalist</h2>
                <p>Where organic curves meet structural precision.</p>
                <button class="btn-minimalist">View Project</button>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
